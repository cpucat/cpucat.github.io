      <div id="Mii-37" class="MiiFace" onclick="changeDetails('37')"><img src="miifaces/37.png" alt="Experiment"></div>

    <div id="TilingBits"></div>

    <script>
      let miiCardPhotoElement = document.getElementById('MiiCardImg');
      let miiInformationDiv = document.getElementById('InfoDiv');

      function changeDetails(index) {
        miiCardPhotoElement.src = "miicards/" + index + ".png";

        // Prepare for the Switch Case of Doom
        // I probably could have indexed this into a file but honestly this seemed simpler and it makes it easier to edit
        switch (index) {
          default:
            miiInformationDiv.innerHTML = "<h1>Unknown</h1><br><p>This Mii does not have a Description.</p>"
            break;
          case '01': // Sans
            miiInformationDiv.innerHTML = "<h1>Sans</h1><br><p>He was the first one on the island.</p><br><p>Married to Miss Pauling.</p>"
            break;
          case '02': // Spong
            miiInformationDiv.innerHTML = "<h1>SpongeBob</h1><br><p>Spongebob is here. I don't have very much more to say about that.</p>"
            break;
          case '03': // Pauling
            miiInformationDiv.innerHTML = "<h1>Miss Pauling</h1><br><p>How is she always on this island if she only gets one day off a year?</p><p>Married to Sans.</p>"
            break;
          case '04': // :}
            miiInformationDiv.innerHTML = "<h1>:}</h1><br><p>Pronounced 'Um', 'Om', or 'Uh', whichever you prefer. Was originally created to be distracting in Smash Bros, but is here now.</p>"
            break;
          case '05': // Cpucat
            miiInformationDiv.innerHTML = "<h1>Cpucat</h1><br><p>Hold on, this mii looks kind of like me! I'm sure that's just a coincidence...</p><p>Married to Experiment.</p>"
            break;
          case '06': // Hamburger
            miiInformationDiv.innerHTML = "<h1>Hamburger</h1><br><p>Hamburger. One of the classic abuses of the mii maker. Do I need to say more?</p>"
            break;
          case '07': // Heavy
            miiInformationDiv.innerHTML = "<h1>Heavy</h1><br><p>It's heavy weapons guy, here from the gravel wars.</p><p>Married to Medic.</p>"
            break;
          case '08': // Medic
            miiInformationDiv.innerHTML = "<h1>Medic</h1><br><p>It's medic. He scares me sometimes.</p><p>Married to Heavy.</p>"
            break;
          case '09': // Pearl
            miiInformationDiv.innerHTML = "<h1>Pearl</h1><br><p>Pearl is here, with Marina! Together they form Off the Hook!</p><p>Married to Marina.</p>"
            break;
          case '10': // Marina
            miiInformationDiv.innerHTML = "<h1>Marina</h1><br><p>Marina from Off the Hook is here, alongside pearl!</p><p>Married to Pearl.</p>"
            break;
          case '11': // Steve
            miiInformationDiv.innerHTML = "<h1>Steve</h1><br><p>Unfortunately, the trees here do not react when punched.</p>"
            break;
          case '12': // Adeline
            miiInformationDiv.innerHTML = "<h1>Adeline</h1><br><p>Child of Sans and Miss Pauling. Not much more to say.</p>"
            break;
          case '13': // Spamton
            miiInformationDiv.innerHTML = "<h1>Spamton</h1><br><p>HEY [Idiot], WANNA PLAY A [Friendly] GAME OF [No Repeats]?</p>"
            break;
          case '14': // Herobrine
            miiInformationDiv.innerHTML = "<h1>Herobrine</h1><br><p>Hold on, this guy looks suspiciously like Steve!</p>";
            break;
          case '15': // The Files
            miiInformationDiv.innerHTML = "<h1>The Files</h1><br><p>██████ ██ █ ██<br>█████ ███<br>███ ████ █████████<br>██████ ███████ ███<br></p>";
            break;
          case '16': // Trump
            miiInformationDiv.innerHTML = "<h1>Trump</h1><br><p>It's... This guy...<br>........I can't say much more...</p><p>Married to Joe Biden.</p>";
            break;
          case '17': // Miisauce
            miiInformationDiv.innerHTML = "<h1>Miisauce</h1><br><p>I don't watch VSauce, I just thought the pun was too good to pass up on.</p>";
            break;
          case '18': // Amogus
            miiInformationDiv.innerHTML = "<h1>Amogus</h1><br><p>ඞ</p>";
            break;
          case '19': // Amogus
            miiInformationDiv.innerHTML = "<h1>Boykisser</h1><br><p>Blatantly stole this mii from <a href='https://www.youtube.com/watch?v=93Xh2ecVPSw&list=PL2_uytedfS7yII0DtnMc5T9AFTvXO6a8M'>Miyoriko's tomodachi life series</a>, but made him using more mii parts.<br>One of, if not, my favorite miis on the island.</p>";
            break;
          case '20': // Bort Hall
            miiInformationDiv.innerHTML = "<h1>Bort Hall</h1><br><p>I'm pretty sure I stole this idea from someone, but I dont remember who, so sorry!</p><p>I dont like this guy very much</p>";
            break;
          case '21': // Kris
            miiInformationDiv.innerHTML = "<h1>Kris</h1><br><p>They sure do live here. I try to stop them from opening dark fountains.</p>";
            break;
          case '22': // Frisk
            miiInformationDiv.innerHTML = "<h1>Frisk</h1><br><p>They Freed the underground at some point, but are now here.</p>";
            break;
          case '23': // Puro
            miiInformationDiv.innerHTML = "<h1>Puro</h1><br><p>Created in panicked response to Trump starting to fall in love with Boykisser, I asked a friend for a different character that Boykisser would be a better match for. This purpose was quickly defeated when trump near-instantly changed his crush to someone else.</p><p>Married to Adrian.</p>";
            break;
          case '24': // Adrian
            miiInformationDiv.innerHTML = "<h1>Adrian</h1><br><p>Real-World friend. Upon being added to the island, the literal first thing this mii did was fall head-over-heels for Puro.</p><p>Married to Puro.</p>";
            break;
          case '25': // Vista
            miiInformationDiv.innerHTML = "<h1>Vista</h1><br><p>Asked a friend for a different character because trying to make non-human characters was both fun and a fantastic waste of time. Not entirely sure what their deal is.</p>";
            break;
          case '26': // Sigmund Freud
            miiInformationDiv.innerHTML = "<h1>Dr. Sigmund Freud</h1><br><h2>Excuse me, have you got a moment? My name is Dr. Sigmund Freud.</h2><br><p>Stolen from <a href='https://youtu.be/c68v6k9_sW4?t=883'>RTGame's Tomodachi life playthrough</a>. Changes who he's crushing on approximately every five minutes.</p>";
            break;
          case '27': // Steve Ballmer
            miiInformationDiv.innerHTML = "<h1>Steve Ballmer</h1><br><p>Former CEO of Microsoft, He has a house on the island!</p><br><br><p>Developers Developers Developers Developers</p>";
            break;
          case '28': // Joe Biden
            miiInformationDiv.innerHTML = "<h1>Joe Biden</h1><br><p>It's the former US President. </p><p>Married to Trump.</p>";
            break;
          case '29': // Steam
            miiInformationDiv.innerHTML = "<h1>Steam</h1><br><p>Created by a friend. It's Steam! If you play games on PC, you probably have them installed.</p><p>The circle in the logo is actually their eye.</p>";
            break;
          case '30': // Dualsense
            miiInformationDiv.innerHTML = "<h1>Dualsense</h1><br><p>Created by a friend. Their voice gives me a headache.</p>";
            break;
          case '31': // Steam Controller
            miiInformationDiv.innerHTML = "<h1>Steam Controller</h1><br><p>Created by a friend. It's the (2026) Steam Controller! You can't use it on the switch as far as I know, but they're on the island!</p>";
            break;
          case '32': // Tim
            miiInformationDiv.innerHTML = "<h1>Tim</h1><br><p>Real-World friend. Not much more to say.</p>";
            break;
          case '33': // Holly
            miiInformationDiv.innerHTML = "<h1>Holly</h1><br><p>Real-World friend. Again, Not much more to say.</p>";
            break;
          case '34': // Annoying Dog
            miiInformationDiv.innerHTML = "<h1>Annoying Dog</h1><br><p><a href='https://youtu.be/dwampY_jIdg?t=172'>It's Toby Fox, Creator of UNDERTALE!</a></p>";
            break;
          case '35': // Yippee
            miiInformationDiv.innerHTML = "<h1>Yippee</h1><br><p>Another direct steal from <a href='https://www.youtube.com/watch?v=93Xh2ecVPSw&list=PL2_uytedfS7yII0DtnMc5T9AFTvXO6a8M'>Miyoriko</a>, The way their voice 'cracks' brings me an immense amount of joy.</p>";
            break;
          case '36': // Terry
            miiInformationDiv.innerHTML = "<h1>Terry</h1><br><p>Child of Sans and Miss Pauling. Once again, there isn't much to say.</p>";
            break;
          case '37': // Experiment
            miiInformationDiv.innerHTML = "<h1>Experiment</h1><br><p>The guy from Gunsaw. They exist on the island, I guess. I probably would be more enthusiastic if they didn't fall in love with my Mii.</p><p>Married to Cpucat.</p>";
            break;
          case '38': // W.D. Gaster
            miiInformationDiv.innerHTML = "<h1>W.D. Gaster</h1><br><p>It's Wing Gaster! The Royal Scientist!</p>";
            break;
          case '39': // Ralsei
            miiInformationDiv.innerHTML = "<h1>Ralsei</h1><br><p>Ralsei is here! I'm not sure how he got out of the dark world, but I'm sure that nothing bad happened because of it.</p><br><p>Deltarune Tomorrow</p>";
            break;
          case '40': // Susie
            miiInformationDiv.innerHTML = "<h1>Susie</h1><br><p>Probably followed Kris here.</p><br><p>Deltarune Tomorrow</p>";
            break;
        }
      }
    </script>
  </body>
</html>
